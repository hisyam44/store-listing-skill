<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sky Hop · store screenshots (game-cinematic)</title>
<!-- Style: game-cinematic. Each slide = one store image; data-name is the file name. Edit freely:
     references/design.md documents the kit, references/styles.md the styles. -->
<meta name="store-targets" content="appstore-iphone-6.9 appstore-iphone-6.3 play-phone">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One:wght@500;600;700;800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="kit/styles.css">
<style>
  :root {
    --accent: #ff6f91;
    --accent-2: #ffc75f;
    --font-display: "Lilita One", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Your overrides go here: per-slide tweaks, per-target positions, e.g.
     html[data-form="tablet"] .callout.x { ... }   html[data-store="google-play"] .sticker { ... } */
</style>
</head>
<body>

<section class="slide s-game-cinematic layout-full caption-bottom" data-name="hero" data-appstore-frame="none" data-play-frame="none">
  <div class="stage"><img class="bg-shot" data-shot="play-03" alt=""></div>
  <div class="caption"><h1 data-fit="2">One tap.<br><span class="accent">Endless sky.</span></h1></div>
</section>

<section class="slide s-game-cinematic layout-full caption-bottom" data-name="play-05" data-appstore-frame="none" data-play-frame="none">
  <div class="stage"><img class="bg-shot" data-shot="play-05" data-focus="50% 60%" alt=""></div>
  <div class="caption"><h1 data-fit="2">Hop across<br><span class="accent">floating islands</span></h1></div>
</section>

<section class="slide s-game-cinematic layout-full caption-bottom" data-name="play-01" data-appstore-frame="none" data-play-frame="none">
  <div class="stage"><img class="bg-shot" data-shot="play-01" alt=""></div>
  <div class="caption"><span class="badge">⭐ +10 per star</span><br><h1 data-fit="2">Grab every<br><span class="accent">shining star</span></h1></div>
</section>

<section class="slide s-game-cinematic layout-full caption-bottom" data-name="title" data-appstore-frame="none" data-play-frame="none">
  <div class="stage"><img class="bg-shot" data-shot="title" alt=""></div>
  <div class="caption"><h1 data-fit="2">Beat your<br><span class="accent">best score</span></h1></div>
</section>

<script src="kit/kit.js"></script>
</body>
</html>
